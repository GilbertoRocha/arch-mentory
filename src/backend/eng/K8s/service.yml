# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: hotline-webapi
spec:
  selector:
    app: hotline-webapi
  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002      
  type: LoadBalancer

# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: hotline-frontend
spec:
  selector:
    app: hotline-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80      
  type: LoadBalancer
  