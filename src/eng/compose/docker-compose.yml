version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Mentory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Mentory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  keyvault:
    image: nagyesta/lowkey-vault:7.1.9-ubi10-minimal
    container_name: azure-keyvault
    ports:
      - "8444:8443"
    environment:
      - LOWKEY_VAULT_SENSITIVE_DATA_EXPOSED=true
      - LOWKEY_VAULT_DB_FILE=/app/data/lowkey-vault.db
    volumes:
      - ~/lowkey_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -k https://localhost:8444/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  pgadmin_data:
