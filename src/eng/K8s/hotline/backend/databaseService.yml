apiVersion: v1
kind: Service
metadata:
  name: postgres-db
spec:
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres-db
subsets:
  - addresses:
      - ip: 172.17.0.1                          
    ports:
      - port: 5432
