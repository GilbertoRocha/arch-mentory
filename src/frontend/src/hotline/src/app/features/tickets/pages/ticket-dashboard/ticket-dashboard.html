<mat-toolbar color="primary" class="mat-elevation-z4">
  <mat-icon>confirmation_number</mat-icon>
  <span>Hotline</span>
</mat-toolbar>

<nav mat-tab-nav-bar [tabPanel]="tabPanel" color="accent">
  <a mat-tab-link routerLink="listAll" routerLinkActive #rla1="routerLinkActive" [active]="rla1.isActive">
    <mat-icon class="tab-icon">list</mat-icon> Listar todas as Ocorrências
  </a>
  <a mat-tab-link routerLink="new" routerLinkActive #rla2="routerLinkActive" [active]="rla2.isActive">
    <mat-icon class="tab-icon">add_circle</mat-icon> Nova Ocorrencia
  </a>
</nav>

<mat-tab-nav-panel #tabPanel>
  <div class="container main-content">
    <router-outlet></router-outlet>
  </div>
</mat-tab-nav-panel>
